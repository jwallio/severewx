[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "severewx"
version = "0.1.0"
description = "Day 1-4 severe-weather forecasting system focused on outbreak-aware hazard guidance."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "xarray>=2024.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "requests>=2.31",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
grib = ["cfgrib>=0.9.11", "eccodes>=1.7.1"]
maps = ["cartopy>=0.22"]
ml = ["lightgbm>=4.3.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["severewx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
